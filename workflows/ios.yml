name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install
      - name: Capacitor sync iOS
        run: npx cap sync ios
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
      - name: Build Unsigned IPA
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -r M12Test.ipa Payload
          ls -lh M12Test.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: M12Test-IPA
          path: ios/App/M12Test.ipa
